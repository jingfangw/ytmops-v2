<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#F4F1EA" />
<title>Delivery Dashboard · You Tiao Mei 油条妹</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    /* Neutral ramp (brand identity) */
    --bg: #F4F1EA; --surface: #FFFFFF; --surface2: #ECEADE;
    --accent: #1A1A18; --accent-light: #333333; --accent2: #D4522A;
    --text: #1A1A18; --text2: #4A4A3F; --text3: #6B6B60;
    --border: #D8D4C6;
    /* State colors — reconciled & documented (see DESIGN.md §2) */
    --green: #2E7D32; --green-tint: #EAF1EA; --green-line: #B9D2BA;
    --red: #C0392B; --red-tint: #F6E7E5; --red-line: #E3B7B2;
    --amber: #A8620B; --amber-tint: #F4EBD9; --amber-line: #E1C08A;
    --whatsapp: #1E8F4E; --whatsapp-hover: #17703D;
    --mono: ui-monospace,'SF Mono','Cascadia Mono',Menlo,monospace;
    --sans: -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    --radius-sm: 4px; --radius: 8px; --radius-lg: 12px; --radius-pill: 999px;
    --focus-ring: 0 0 0 3px rgba(26,26,24,.16);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); font-family: var(--sans); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }

  /* Shared focus-visible for every interactive element */
  button:focus-visible, input:focus-visible, a:focus-visible,
  .chip:focus-visible, .tab:focus-visible {
    outline: none; box-shadow: var(--focus-ring); border-radius: var(--radius);
  }
  .chip:focus-visible { border-radius: var(--radius-pill); }

  /* LOGIN */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 40px 36px; width: 100%; max-width: 380px; }
  .login-logo { margin-bottom: 4px; display: flex; justify-content: center; }
  .login-logo img { width: 140px; height: auto; display: block; }
  .login-sub { font-size: 12px; font-family: var(--mono); color: var(--text2); margin-bottom: 32px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 11px; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--text2); margin-bottom: 6px; }
  .field input { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; font-family: var(--sans); background: var(--bg); color: var(--text); outline: none; transition: border 0.15s; }
  .field input:focus { border-color: var(--accent); background: var(--surface); }
  .btn-login { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius); font-size: 14px; font-weight: 700; font-family: var(--sans); cursor: pointer; margin-top: 8px; transition: background 0.15s; }
  .btn-login:hover { background: #000; }
  .login-err { font-size: 12px; color: var(--red); font-family: var(--mono); margin-top: 12px; display: none; line-height: 1.5; }

  /* LANG SWITCH */
  .lang-sw { display: flex; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .lang-btn { padding: 5px 12px; font-size: 11px; font-family: var(--mono); cursor: pointer; color: var(--text2); background: none; border: none; transition: background-color 0.15s, color 0.15s; }
  .lang-btn.active { background: var(--accent); color: #fff; font-weight: 600; }

  /* APP */
  .app { display: none; max-width: 1140px; margin: 0 auto; padding: 24px 20px 60px; }

  /* TOPBAR */
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; flex-wrap: wrap; gap: 12px; }
  .brand-row { display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; min-width: 0; flex: 1 1 auto; }
  .brand { font-size: 19px; font-weight: 800; color: var(--accent); letter-spacing: -0.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .top-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .user-pill { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-pill); padding: 6px 14px; font-size: 12px; flex-shrink: 0; }
  .role-badge { font-size: 10px; font-family: var(--mono); background: var(--accent); color: #fff; border-radius: var(--radius-sm); padding: 2px 7px; text-transform: uppercase; letter-spacing: .04em; }
  .date-pill { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-pill); padding: 6px 14px; }
  .date-pill label { font-size: 10px; font-family: var(--mono); color: var(--text2); text-transform: uppercase; letter-spacing: 0.06em; }
  .date-pill input { font-family: var(--mono); font-size: 12px; border: none; background: transparent; color: var(--text); outline: none; cursor: pointer; }
  .sync-label { font-size: 11px; font-family: var(--mono); color: var(--text2); display: inline-flex; align-items: center; }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: inline-block; margin-right: 5px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.3} }
  .home-icon-btn { width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); color: var(--text2); display: flex; align-items: center; justify-content: center; font-size: 18px; text-decoration: none; transition: background-color 0.15s, border-color 0.15s, color 0.15s; }
  .home-icon-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--surface2); }

  /* TABS */
  .tabs { display: flex; gap: 4px; margin-bottom: 18px; background: var(--surface2); border-radius: var(--radius); padding: 4px; width: fit-content; flex-wrap: wrap; }
  .tab { padding: 7px 16px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; cursor: pointer; border: none; background: transparent; color: var(--text2); transition: background-color 0.15s, color 0.15s; white-space: nowrap; }
  .tab.active { background: var(--accent); color: #fff; }

  /* TRACKER TOOLBAR */
  .tracker-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .tracker-toolbar .left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .tracker-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 5px; padding: 8px 14px; border-radius: var(--radius); font-size: 12px; font-weight: 700; font-family: var(--sans); cursor: pointer; border: 1px solid transparent; transition: background-color 0.15s, border-color 0.15s, color 0.15s; white-space: nowrap; }
  .btn-ghost { background: transparent; border-color: var(--border); color: var(--text2); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #000; }
  .btn-danger { background: transparent; border-color: var(--red-line); color: var(--red); }
  .btn-danger:hover { background: var(--red-tint); }

  /* FILTER CHIPS */
  .filters { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; font-family: var(--mono); font-size: 11px; padding: 7px 13px; border-radius: var(--radius-pill); border: 1px solid var(--border); background: var(--surface); color: var(--text2); cursor: pointer; font-weight: 600; transition: background-color 0.15s, color 0.15s, border-color 0.15s; }
  .chip .chip-n { opacity: .6; margin-left: 2px; }
  .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .chip.on .chip-n { opacity: .85; }

  /* CARD LIST */
  .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; align-items: start; }
  .row { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); border-left: 3px solid var(--border); padding: 11px 12px 12px; transition: border-color 0.2s var(--ease), background-color 0.2s var(--ease); }
  .row[data-state="filled"] { border-left-color: var(--green); background: var(--green-tint); }
  .row-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .row-idx { font-family: var(--mono); font-size: 11px; color: var(--text3); min-width: 15px; }
  .row-name { font-weight: 700; font-size: 15px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { font-family: var(--mono); font-size: 9px; padding: 2px 8px; border-radius: var(--radius-pill); border: 1px solid var(--green-line); color: var(--green); background: var(--green-tint); font-weight: 600; flex-shrink: 0; text-transform: uppercase; letter-spacing: .04em; }
  .tag.ext { border-color: var(--amber-line); color: var(--amber); background: var(--amber-tint); }
  .fields { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .fcell { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .flabel { font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: .04em; color: var(--text3); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .qty { width: 100%; min-width: 0; height: 48px; text-align: center; font-family: var(--mono); font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); padding: 0; -moz-appearance: textfield; transition: border-color 0.15s, box-shadow 0.15s; }
  .row[data-state="filled"] .qty { background: var(--surface); }
  .qty::-webkit-outer-spin-button, .qty::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .qty:focus { outline: none; border-color: var(--accent); box-shadow: var(--focus-ring); }
  .qty.z { color: var(--text3); font-weight: 500; background: var(--bg); }
  .qty:disabled { opacity: 0.5; cursor: not-allowed; background: var(--surface2); }
  .row-foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 11px; }
  .msg-btn { display: inline-flex; align-items: center; gap: 5px; height: 36px; padding: 0 16px; border-radius: var(--radius); border: none; background: var(--whatsapp); color: #fff; font-family: var(--sans); font-size: 12px; font-weight: 700; cursor: pointer; transition: background-color 0.15s; }
  .msg-btn:hover { background: var(--whatsapp-hover); }
  .clear-btn { display: inline-flex; align-items: center; gap: 5px; height: 36px; padding: 0 14px; border-radius: var(--radius); border: 1px solid var(--border); background: transparent; color: var(--text2); font-family: var(--sans); font-size: 12px; font-weight: 600; cursor: pointer; transition: background-color 0.15s, border-color 0.15s; }
  .clear-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .clear-btn:disabled { opacity: .4; cursor: not-allowed; }

  /* TOTALS BAR — leveled up */
  .totals-bar { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-top: 16px; padding: 14px 18px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); font-family: var(--mono); font-size: 12px; }
  .totals-bar .tot-label { font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; }
  .totals-bar .tot-filled { color: var(--text2); display: inline-flex; align-items: center; gap: 6px; }
  .totals-bar .tot-filled b { color: var(--green); font-size: 13px; }
  .totals-bar .tot-divider { flex: 1 1 12px; height: 1px; background: var(--border); min-width: 12px; }
  .totals-bar .tot-item { color: var(--text2); display: inline-flex; align-items: baseline; gap: 5px; }
  .totals-bar .tot-item b { color: var(--accent); font-size: 16px; font-variant-numeric: tabular-nums; }

  /* PANELS */
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }

  /* HISTORY */
  .history-block { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 14px; background: var(--surface); }
  .history-hdr { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--surface2); border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 8px; }
  .history-date { font-size: 14px; font-weight: 700; color: var(--accent); }
  .history-meta { font-size: 11px; font-family: var(--mono); color: var(--text2); margin-top: 2px; }
  .history-tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
  .history-tbl th { font-size: 10px; font-family: var(--mono); text-transform: uppercase; letter-spacing: .04em; color: var(--text2); padding: 7px 12px; background: var(--surface2); border-bottom: 1px solid var(--border); text-align: center; }
  .history-tbl th:nth-child(1), .history-tbl th:nth-child(2) { text-align: left; }
  .history-tbl td { padding: 7px 12px; border-bottom: 1px solid var(--border); text-align: center; font-family: var(--mono); font-size: 12px; }
  .history-tbl td:nth-child(1), .history-tbl td:nth-child(2) { text-align: left; font-family: var(--sans); font-weight: 600; font-size: 13px; }
  .history-tbl tr:last-child td { border-bottom: none; }
  .history-foot td { font-weight: 700; background: var(--surface2); border-top: 1px solid var(--border); color: var(--accent); }

  /* MODAL */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
  .overlay.open { display: flex; animation: overlay-in 0.18s var(--ease); }
  @keyframes overlay-in { from { opacity: 0 } to { opacity: 1 } }
  .modal, .confirm-modal { animation: modal-in 0.22s var(--ease); }
  @keyframes modal-in { from { opacity: 0; transform: translateY(8px) scale(.98) } to { opacity: 1; transform: none } }
  .modal { background: var(--surface); border-radius: var(--radius-lg); padding: 26px; max-width: 460px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
  .modal-title { font-size: 15px; font-weight: 800; margin-bottom: 3px; }
  .modal-sub { font-size: 11px; color: var(--text2); font-family: var(--mono); margin-bottom: 14px; }
  .modal-msg { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; font-family: var(--mono); font-size: 12px; line-height: 1.8; white-space: pre-wrap; max-height: 320px; overflow-y: auto; }
  .modal-actions { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end; align-items: center; }
  .copy-ok { font-size: 11px; color: var(--green); font-family: var(--mono); font-weight: 600; }

  /* LOCK BANNER — rebuilt in-system (was off-palette mint) */
  .lock-banner { background: var(--green-tint); border: 1px solid var(--green-line); border-radius: var(--radius); padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .lock-banner-left { display: flex; align-items: center; gap: 11px; }
  .lock-icon { width: 30px; height: 30px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 16px; color: var(--green); }
  .lock-text { font-size: 13px; font-weight: 700; color: var(--accent); }
  .lock-sub { font-size: 11px; color: var(--text2); font-family: var(--mono); margin-top: 2px; }
  .unlock-btn { font-size: 12px; font-family: var(--mono); color: var(--accent); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-pill); padding: 6px 14px; cursor: pointer; font-weight: 600; white-space: nowrap; transition: background-color 0.15s, color 0.15s, border-color 0.15s; }
  .unlock-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .lock-btn { font-size: 12px; font-family: var(--mono); color: var(--accent); background: transparent; border: 1px solid var(--border); border-radius: var(--radius-pill); padding: 6px 14px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; transition: background-color 0.15s, color 0.15s, border-color 0.15s; }
  .lock-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* TOAST — aria-live + state variants + slide-up */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(12px); background: var(--accent); color: #fff; padding: 11px 20px; border-radius: var(--radius-pill); font-size: 12px; font-family: var(--mono); z-index: 300; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.2s var(--ease), transform 0.2s var(--ease); box-shadow: 0 8px 24px rgba(0,0,0,0.18); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.ok { background: var(--green); }
  .toast.err { background: var(--red); }
  .empty-state { text-align: center; padding: 44px 20px; color: var(--text3); font-family: var(--mono); font-size: 12px; line-height: 2; }
  .empty-state .es-big { font-size: 22px; display: block; margin-bottom: 6px; filter: grayscale(.2); }

  /* CONFIRM MODAL */
  .confirm-modal { background: var(--surface); border-radius: var(--radius-lg); padding: 24px; max-width: 340px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
  .confirm-title { font-size: 15px; font-weight: 800; margin-bottom: 8px; }
  .confirm-msg { font-size: 13px; color: var(--text2); line-height: 1.5; margin-bottom: 20px; }
  .confirm-actions { display: flex; gap: 8px; justify-content: flex-end; }

  @media (max-width: 560px) {
    .app { padding: 16px 12px 48px; }
    .list { grid-template-columns: 1fr; }
    /* Keep Clear All / Internal / Generate Dispatch on one row */
    .tracker-actions { flex-wrap: nowrap; width: 100%; gap: 6px; justify-content: flex-start; }
    .tracker-actions .btn { flex: 0 1 auto; min-width: 0; justify-content: center; padding: 9px 8px; font-size: 11px; gap: 4px; }
    .tracker-actions .btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .toast, .row, .qty { transition: opacity 0.15s !important; }
    .toast.show { transform: translateX(-50%); }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <div class="login-logo"><img src="ytm-logo-full.png" alt="You Tiao Mei" /></div>
    <div class="login-sub" id="loginSub">Delivery Dashboard</div>
    <div class="field"><label id="lblEmail">Email</label><input type="email" id="loginEmail" placeholder="you@example.com" /></div>
    <div class="field"><label id="lblPass">Password</label><input type="password" id="loginPass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()" /></div>
    <button class="btn-login" id="btnLoginLabel" onclick="doLogin()">Sign in</button>
    <div class="login-err" id="loginErr"></div>
    <div style="margin-top:20px;display:flex;justify-content:center;">
      <div class="lang-sw">
        <button class="lang-btn active" onclick="setLang('en',this)">EN</button>
        <button class="lang-btn" onclick="setLang('zh',this)">中文</button>
      </div>
    </div>
  </div>
</div>

<!-- APP -->
<div class="app" id="appWrap">
  <div class="top-bar">
    <div class="brand-row">
      <a class="home-icon-btn" href="index.html" aria-label="Home">←</a>
      <div class="brand">🚚 <span id="brandLabel">Delivery Dashboard</span></div>
      <div class="user-pill">
        <span id="topEmail"></span>
        <span class="role-badge" id="topRole"></span>
      </div>
    </div>
    <div class="top-right">
      <div class="lang-sw">
        <button class="lang-btn active" id="appLangEn" onclick="setLang('en',this)">EN</button>
        <button class="lang-btn" id="appLangZh" onclick="setLang('zh',this)">中文</button>
      </div>
      <button class="btn btn-ghost" id="signOutBtn" onclick="doLogout()">Sign out</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabTrackerBtn" onclick="switchTab('tracker')"><span id="tabTracker_lbl">Daily Tracker</span></button>
    <button class="tab" id="tabHistoryBtn" onclick="switchTab('history')"><span id="tabHistory_lbl">History</span></button>
  </div>

  <!-- TRACKER TAB -->
  <div id="tabTracker">

    <!-- LOCK BANNER -->
    <div class="lock-banner" id="lockBanner" style="display:none;">
      <div class="lock-banner-left">
        <div class="lock-icon">🔒</div>
        <div>
          <div class="lock-text" id="lockBannerTitle">Day locked</div>
          <div class="lock-sub" id="lockBannerSub"></div>
        </div>
      </div>
      <button class="unlock-btn" onclick="unlockDay()" id="unlockBtn">Unlock</button>
    </div>

    <div class="tracker-toolbar">
      <div class="left">
        <span class="sync-label"><span class="sync-dot"></span><span id="liveLabel">Live</span></span>
        <div class="date-pill">
          <label id="dateLabel">Date</label>
          <input type="date" id="dateInput" />
        </div>
        <button class="lock-btn" id="lockBtn" onclick="lockDay()" style="display:none;">🔓 <span id="lockBtnLabel">Lock day</span></button>
      </div>
      <div class="tracker-actions">
        <button class="btn btn-ghost" id="clearBtn" onclick="clearAll()"><span id="clearAllLabel">↺ Clear All</span></button>
        <button class="btn btn-ghost" onclick="showInternalMsg()"><span id="internalLabel">🏠 Internal Summary</span></button>
        <button class="btn btn-primary" onclick="showLogisticsMsg()"><span id="dispatchLabel">📋 Generate Dispatch</span></button>
      </div>
    </div>

    <div class="filters" id="filters"></div>

    <div class="list" id="trackerList"></div>

    <div class="totals-bar" id="totalsBar">

// ── UTILS ─────────────────────────────────────────────────────
function toast(msg, kind='', dur=2200) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'toast show' + (kind ? (' ' + kind) : '');
  clearTimeout(el._t); el._t = setTimeout(() => el.className = 'toast', dur);
}
function getDate() { return document.getElementById('dateInput').value; }
function getSingaporeDate() {
  return new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Singapore', year: 'numeric', month: '2-digit', day: '2-digit'
  }).format(new Date());
}
function isToday() { return getDate() === getSingaporeDate(); }
function isPastDate() { return getDate() < getSingaporeDate(); }
function isEditable() { return isToday() && canEdit() && !isDayLocked; }
function formatDate(str) {
  if (!str) return '';
  const [y,m,d] = str.split('-');
  return `${parseInt(d)} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][parseInt(m)-1]} ${y}`;
}
function canEdit() { return currentRole === 'admin' || currentRole === 'editor'; }
function isAdmin() { return currentRole === 'admin'; }
function isInternal(o) { return o.is_internal !== false; }
function isFilled(o) { const r = deliveries[o.id] || {}; return FIELDS.some(f => (r[f]||0) > 0); }

// ── AUTH ──────────────────────────────────────────────────────
async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass  = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginErr');

function showErr(msg) {
  const el = document.getElementById('loginErr');

}

async function doLogout() {
  if (realtimeChannel) sb.removeChannel(realtimeChannel);

}

async function bootApp(user) {

// ── OUTLETS ───────────────────────────────────────────────────
// Outlet editing (name/type/ref/tracking) lives entirely in manage-outlets.html;
// this page only reads outlets for the delivery tracker.
async function loadOutlets() {
  const { data } = await sb.from('outlets').select('*').order('position');
  outlets = data || [];
}

// ── DELIVERIES ────────────────────────────────────────────────
async function loadDeliveries() {
  const { data } = await sb.from('deliveries').select('*').eq('date', getDate());
  deliveries = {};
  (data || []).forEach(r => { deliveries[r.outlet_id] = r; });
}

async function upsertDelivery(outletId, field, value) {
  const date = getDate();
  const existing = deliveries[outletId];
  if (existing && existing.id) {
    await sb.from('deliveries').update({ [field]: value, updated_at: new Date().toISOString() }).eq('id', existing.id);
    existing[field] = value;
  } else {
    const row = { date, outlet_id: outletId, tray:0, basket:0, box:0, pandan:0, [field]: value };
    const { data } = await sb.from('deliveries').insert(row).select().single();
    if (data) deliveries[outletId] = data;
  }
}

async function clearAll() {
  if (isPastDate()) return;
  if (!await showConfirm(lang==='zh' ? `清除 ${formatDate(getDate())} 的所有数量？` : `Clear all quantities for ${formatDate(getDate())}?`, lang==='zh'?'清除全部':'Clear All')) return;
  await sb.from('deliveries').delete().eq('date', getDate());
  deliveries = {};
  renderTracker();
  toast((lang==='zh'?'已清除 · ':'Cleared for ') + formatDate(getDate()), 'ok');
}

async function clearOutlet(outletId) {
  if (!isEditable()) return;
  const o = outlets.find(x => x.id === outletId);
  if (!o || !isFilled(o)) return;
  await sb.from('deliveries').delete().eq('date', getDate()).eq('outlet_id', outletId);
  delete deliveries[outletId];
  renderTracker();
  toast((lang==='zh'?'已清除 · ':'Cleared · ') + o.name, 'ok');
}

// ── TRACKER (card view) ───────────────────────────────────────
function inFilter(o) {
  return filter === 'all' || (filter === 'tofill' && !isFilled(o)) || (filter === 'filled' && isFilled(o));
}
function setFilter(k) { filter = k; renderTracker(); }

function renderFilters() {
  const t = T[lang];
  const counts = {
    all: outlets.length,
    tofill: outlets.filter(o => !isFilled(o)).length,
    filled: outlets.filter(o => isFilled(o)).length,
  };
  const defs = [['all',t.fAll],['tofill',t.fToFill],['filled',t.fFilled]];
  const el = document.getElementById('filters');
  if (el) el.innerHTML = defs.map(([k,lbl]) =>
    `<button class="chip ${filter===k?'on':''}" onclick="setFilter('${k}')">${lbl}<span class="chip-n">${counts[k]}</span></button>`).join('');
}

function renderTracker() {
  const t = T[lang];
  const list = document.getElementById('trackerList');
  if (!list) return;
  const rows = outlets.filter(inFilter);
  if (!rows.length) {
    list.innerHTML = `<div class="empty-state"><span class="es-big">📭</span>${outlets.length ? (lang==='zh'?'此筛选下暂无门店':'No outlets in this filter') : (lang==='zh'?'暂无门店':'No outlets yet')}</div>`;
  } else {
    const editable = isEditable();
    list.innerHTML = rows.map(o => {
      const i = outlets.indexOf(o);
      const r = deliveries[o.id] || {};
      const filled = isFilled(o);
      const internal = isInternal(o);
      const fields = FIELDS.map(f => {
        const v = r[f] || 0;
        return `<div class="fcell"><div class="flabel">${t['th'+f.charAt(0).toUpperCase()+f.slice(1)]}</div>
          <input class="qty ${v===0?'z':''}" inputmode="numeric" pattern="[0-9]*" type="number" min="0" value="${v}"
                 data-id="${o.id}" data-f="${f}" ${editable?'':'disabled'} onfocus="this.select()" aria-label="${o.name} ${f}"></div>`;
      }).join('');
      return `<div class="row" data-state="${filled?'filled':'empty'}" id="card-${o.id}">
        <div class="row-top">
          <span class="row-idx">${i+1}</span>
          <span class="row-name">${o.name}</span>
          <span class="tag ${internal?'':'ext'}">${internal?t.intTag:t.extTag}</span>
        </div>
        <div class="fields">${fields}</div>
        <div class="row-foot">
          <button class="clear-btn" ${filled && editable ? '' : 'disabled'} onclick="clearOutlet('${o.id}')">↺ ${t.clearBtn}</button>
          <button class="msg-btn" onclick="showOutletMsg('${o.id}')">✉ ${t.msgBtn}</button>
        </div>
      </div>`;
    }).join('');
  }
  const listEl = document.getElementById('trackerList');
  listEl.oninput = onInput;
  renderFilters();
  updateTotals();
}

function onInput(e) {
  const el = e.target;
  if (!el.classList.contains('qty') || !el.dataset.id) return;
  const id = el.dataset.id, f = el.dataset.f;
  const val = Math.max(0, parseInt(el.value)||0);
  el.value = val;
  el.classList.toggle('z', val === 0);
  if (!deliveries[id]) deliveries[id] = { tray:0, basket:0, box:0, pandan:0 };
  deliveries[id][f] = val;
  const filled = FIELDS.some(fn => (deliveries[id][fn]||0) > 0);
  const card = document.getElementById('card-' + id);
  if (card) {
    card.dataset.state = filled ? 'filled' : 'empty';
    const cb = card.querySelector('.clear-btn');
    if (cb) cb.disabled = !(filled && isEditable());
  }
  updateTotals();
  renderFilters();
  upsertDelivery(id, f, val);
}

function updateTotals() {
  let tray=0, basket=0, box=0, pandan=0, filled=0;
  outlets.forEach(o => {
    const r = deliveries[o.id] || {};
    tray+=r.tray||0; basket+=r.basket||0; box+=r.box||0; pandan+=r.pandan||0;
    if (isFilled(o)) filled++;
  });
  const set = (id, val) => { const el=document.getElementById(id); if(el) el.textContent=val; };
  set('fTray', tray); set('fBasket', basket); set('fBox', box); set('fPandan', pandan);
  set('filledCount', filled); set('outletCount', outlets.length);
}

// ── DAY LOCK ──────────────────────────────────────────────────
async function loadLockState() {
  const { data } = await sb.from('day_locks').select('*').eq('date', getDate()).maybeSingle();
  isDayLocked = !!data;
  updateLockUI(data);
}

function updateLockUI(lockData) {
  const banner = document.getElementById('lockBanner');
  const lockBtn = document.getElementById('lockBtn');
  const clearBtn = document.getElementById('clearBtn');
  const unlockBtn = document.getElementById('unlockBtn');

  if (isDayLocked) {
    banner.style.display = 'flex';
    if (lockBtn) lockBtn.style.display = 'none';
    if (clearBtn) clearBtn.style.display = 'none';
    if (unlockBtn) unlockBtn.style.display = canEdit() ? 'block' : 'none';
    if (lockData) {
      const lockedBy = lockData.locked_by.split('@')[0];
      const lockedAt = new Date(lockData.locked_at.endsWith('Z') ? lockData.locked_at : lockData.locked_at + 'Z');
      const timeStr = lockedAt.toLocaleTimeString('en-SG', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Singapore' });
      document.getElementById('lockBannerTitle').textContent = lang === 'zh' ? '今日已锁定' : 'Day locked';
      document.getElementById('lockBannerSub').textContent = `${lang === 'zh' ? '锁定者' : 'Locked by'} ${lockedBy} · ${timeStr}`;
    }
  } else {
    banner.style.display = 'none';
    if (lockBtn) lockBtn.style.display = (canEdit() && isToday()) ? 'inline-flex' : 'none';
    if (clearBtn) clearBtn.style.display = (canEdit() && isToday()) ? 'inline-flex' : 'none';
  }
  renderTracker();
}

async function lockDay() {
  if (!canEdit()) return;
  if (!await showConfirm(lang === 'zh' ? '确定锁定今日记录？锁定后无法编辑。' : 'Lock today\'s data? No editing until unlocked.', lang === 'zh' ? '锁定' : 'Lock Day')) return;
  const { error } = await sb.from('day_locks').insert({ date: getDate(), locked_by: currentUser.email });
  if (error) { console.error(error); toast(T[lang].errGeneric, 'err', 3500); return; }
  isDayLocked = true;
  const { data } = await sb.from('day_locks').select('*').eq('date', getDate()).maybeSingle();
  updateLockUI(data);
  toast(lang === 'zh' ? '🔒 今日已锁定' : '🔒 Day locked', 'ok');
}

async function unlockDay() {
  if (!canEdit()) return;
  if (!await showConfirm(lang === 'zh' ? '确定解锁今日记录？' : 'Unlock today\'s data?', lang === 'zh' ? '解锁' : 'Unlock Day')) return;
  const { error } = await sb.from('day_locks').delete().eq('date', getDate());
  if (error) { console.error(error); toast(T[lang].errGeneric, 'err', 3500); return; }
  isDayLocked = false;
  updateLockUI(null);
  toast(lang === 'zh' ? '🔓 已解锁' : '🔓 Day unlocked', 'ok');
}

// ── REALTIME ──────────────────────────────────────────────────
function subscribeRealtime() {
  realtimeChannel = sb.channel('db-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'deliveries' }, async payload => {
      const changedDate = (payload.new || payload.old || {}).date;
      if (changedDate && changedDate !== getDate()) return;
      await loadDeliveries(); renderTracker();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'outlets' }, async () => {
      await loadOutlets(); renderTracker();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'day_locks' }, async payload => {
      const changedDate = (payload.new || payload.old || {}).date;
      if (changedDate && changedDate !== getDate()) return;
      await loadLockState();
    })
    .subscribe();
}

// ── MESSAGES ──────────────────────────────────────────────────
function showOutletMsg(outletId) {
  const o = outlets.find(x => x.id === outletId);
  if (!o) return;
  const r = deliveries[outletId] || {};
  const lines = FIELDS.filter(f => (r[f]||0) > 0).map(f => `${FIELD_LABELS[f]}: *${r[f]}*`).join('\n');
  if (!lines) { toast((lang === 'zh' ? '该门店暂无数量记录：' : 'No quantities entered for ') + o.name); return; }
  const msg = lang === 'zh'
    ? `您好 *${o.name}* 👋\n\n📦 *${formatDate(getDate())} 派送*\n\n${lines}\n\n请在收货时核对数量并确认，谢谢！🙏`
    : `Hi *${o.name}* 👋\n\n📦 *Delivery for ${formatDate(getDate())}*\n\n${lines}\n\nPlease check quantities upon receipt and confirm. Thank you! 🙏`;
  openModal((lang==='zh'?'门店消息 · ':'Message · ') + o.name, formatDate(getDate()), msg);
}

function showLogisticsMsg() {
  const active = outlets.filter(o => isFilled(o));
  if (!active.length) { toast(lang === 'zh' ? '暂无数量记录' : 'No quantities entered yet'); return; }
  const lines = active.map((o, i) => {
    const r = deliveries[o.id] || {};
    const parts = FIELDS.filter(f => (r[f]||0) > 0).map(f => `${r[f]}${FIELD_CODE[f]}`).join(' | ');
    return `${i+1}. ${o.name} — ${parts}`;
  }).join('\n');
  const tot = { tray:0, basket:0, box:0, pandan:0 };
  outlets.forEach(o => { const r=deliveries[o.id]||{}; FIELDS.forEach(f => tot[f]+=(r[f]||0)); });
  const totLines = FIELDS.filter(f => tot[f] > 0).map(f => `${FIELD_LABELS[f]}: ${tot[f]}`).join('\n');
  const totalWord = lang === 'zh' ? `合计：${active.length} 门店` : `TOTAL: ${active.length} outlets`;
  const msg = `📦 *${lang==='zh'?'派送单':'DELIVERY ORDER'} — ${formatDate(getDate())}*\n\n${lines}\n\n*${totalWord}*\n${totLines}\n\nT=Tray 盘 | B=Basket 篮 | Bx=Box 箱 | P=Pandan 香兰叶`;
  openModal(lang==='zh'?'生成派送单':'Logistics Summary', `${active.length} ${lang==='zh'?'门店':'outlets'} · ${formatDate(getDate())}`, msg);
}

function showInternalMsg() {
  const internalOutlets = outlets.filter(o => isInternal(o));
  const active = internalOutlets.filter(o => isFilled(o));
  if (!active.length) { toast(lang === 'zh' ? '内部门店暂无数量记录' : 'No quantities entered for internal outlets'); return; }
  const lines = active.map((o, i) => {
    const r = deliveries[o.id] || {};
    const parts = FIELDS.filter(f => (r[f]||0) > 0).map(f => `${r[f]}${FIELD_CODE[f]}`).join(' | ');
    return `${i+1}. ${o.name} — ${parts}`;
  }).join('\n');
  const msg = `📦 *${lang==='zh'?'内部派送':'INTERNAL DISPATCH'} — ${formatDate(getDate())}*\n\n${lines}\n\nT=Tray 盘 | B=Basket 篮 | Bx=Box 箱 | P=Pandan 香兰叶`;
  openModal(lang==='zh'?'内部汇总':'Internal Summary', `${active.length} ${lang==='zh'?'内部门店':'internal outlets'} · ${formatDate(getDate())}`, msg);
}

function openModal(title, sub, msg) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalSub').textContent = sub;
  document.getElementById('modalMsg').textContent = msg;
  document.getElementById('copyOk').style.display = 'none';
  document.getElementById('modal').classList.add('open');
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }

// ── CONFIRM MODAL ─────────────────────────────────────────────
let _confirmResolve = null;
function showConfirm(msg, title) {
  return new Promise(resolve => {
    _confirmResolve = resolve;
    document.getElementById('confirmTitle').textContent = title || (lang==='zh'?'确定吗？':'Are you sure?');
    document.getElementById('confirmMsg').textContent = msg;
    document.getElementById('confirmOkBtn').textContent = T[lang].confirm;
    document.getElementById('confirmModal').classList.add('open');
  });
}
function closeConfirm(result) {
  document.getElementById('confirmModal').classList.remove('open');
  if (_confirmResolve) { _confirmResolve(result); _confirmResolve = null; }
}
function copyMsg() {
  navigator.clipboard.writeText(document.getElementById('modalMsg').textContent).then(() => {
    document.getElementById('copyOk').style.display = 'inline';
    setTimeout(() => document.getElementById('copyOk').style.display = 'none', 2000);
    toast('✓ ' + (lang === 'zh' ? '已复制到剪贴板' : 'Copied to clipboard'), 'ok');
  });
}

// ── HISTORY ───────────────────────────────────────────────────
async function renderHistory() {
  const t = T[lang];
  const container = document.getElementById('historyContent');
  container.innerHTML = `<div class="empty-state"><span class="es-big">⏳</span>${t.hLoading}</div>`;
  const { data, error } = await sb.from('deliveries').select('*, outlets(name)').order('date', { ascending: false });
  if (error) { console.error(error); container.innerHTML = `<div class="panel"><div class="empty-state"><span class="es-big">⚠️</span>${t.errGeneric}</div></div>`; return; }
  if (!data || !data.length) {
    container.innerHTML = `<div class="panel"><div class="empty-state"><span class="es-big">🗂️</span>${t.hEmpty}<br><span style="opacity:.7">${t.hEmptyHint}</span></div></div>`;
    return;
  }
  const byDate = {};
  data.forEach(r => { if (!byDate[r.date]) byDate[r.date]=[]; byDate[r.date].push(r); });
  const dates = Object.keys(byDate).sort().reverse();
  container.innerHTML = dates.map(date => {
    const rows = byDate[date].filter(r => FIELDS.some(f => (r[f]||0) > 0));
    if (!rows.length) return '';
    const tot = { tray:0, basket:0, box:0, pandan:0 };
    rows.forEach(r => FIELDS.forEach(f => tot[f]+=(r[f]||0)));
    const metaParts = FIELDS.filter(f=>tot[f]>0).map(f=>`${tot[f]} ${t['th'+f.charAt(0).toUpperCase()+f.slice(1)]}`).join(' · ');
    return `
      <div class="history-block">
        <div class="history-hdr">
          <div>
            <div class="history-date">${formatDate(date)}</div>
            <div class="history-meta">${rows.length} ${t.hOutlets} · ${metaParts}</div>
          </div>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-ghost" style="font-size:11px;" onclick="jumpToDate('${date}')">${t.hEdit}</button>
            ${isAdmin()?`<button class="btn btn-danger" style="font-size:11px;" onclick="deleteDay('${date}')">${t.hDelete}</button>`:''}
          </div>
        </div>
        <div style="overflow-x:auto;">
          <table class="history-tbl">
            <thead><tr><th>#</th><th>${t.thOutlet}</th><th>${t.thTray}</th><th>${t.thBasket}</th><th>${t.thBox}</th><th>${t.thPandan}</th></tr></thead>
            <tbody>${rows.map((r,i)=>`
              <tr>
                <td style="color:var(--text3);font-size:11px;">${i+1}</td>
                <td>${r.outlets?.name||'—'}</td>
                ${FIELDS.map(f=>`<td>${r[f]||0}</td>`).join('')}
              </tr>`).join('')}
            </tbody>
            <tfoot><tr class="history-foot"><td colspan="2">${t.totalLabel}</td>${FIELDS.map(f=>`<td>${tot[f]}</td>`).join('')}</tr></tfoot>
          </table>
        </div>
      </div>`;
  }).join('');
}

async function jumpToDate(date) {
  document.getElementById('dateInput').value = date;
  isDayLocked = false;
  await loadDeliveries();
  await loadLockState();
  renderTracker();
  switchTab('tracker');
  const cb = document.getElementById('clearBtn');
  if (cb) cb.style.display = (canEdit() && isToday() && !isDayLocked) ? 'inline-flex' : 'none';
}

async function deleteDay(date) {
  if (!await showConfirm(T[lang].delMsg(formatDate(date)), T[lang].delTitle)) return;
  await sb.from('deliveries').delete().eq('date', date);
  renderHistory();
  toast(T[lang].dayDeleted, 'ok');
}

// ── TABS ──────────────────────────────────────────────────────
function switchTab(tab) {
  ['tracker','history'].forEach(t => {
    const el = document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1));
    if (el) el.style.display = t === tab ? 'block' : 'none';
  });
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const tabIds = { tracker:'tabTrackerBtn', history:'tabHistoryBtn' };
  const activeBtn = document.getElementById(tabIds[tab]);
  if (activeBtn) activeBtn.classList.add('active');
  document.title = `${tab==='history'?T[lang].titleHistory:T[lang].titleTracker} · You Tiao Mei 油条妹`;
  if (tab === 'history') renderHistory();
}

// ── SESSION ───────────────────────────────────────────────────
applyLang();
sb.auth.getSession().then(async ({ data: { session } }) => {
  if (session) await bootApp(session.user);
});

// ── ESC TO CLOSE MODALS ──────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeConfirm(false); }
});
</script>
</body>
</html>
